<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a6847">
<title>FarmaFácil</title><style>
body{font-family:sans-serif;background:#f5f5f5;margin:0}
#app{max-width:480px;margin:auto;background:#fff;min-height:100vh}
button{padding:10px;margin-top:10px}
input,select{width:100%;padding:10px;margin-top:5px}
</style></head><body>
<div id="app">
<h2>FarmaFácil</h2><h3>Produto</h3>
<input id="name" placeholder="Nome">
<input id="price" placeholder="Preço">
<button onclick="add()">Salvar</button><h3>Lista</h3>
<ul id="list"></ul><button onclick="send()">Enviar WhatsApp</button>

</div><script>
let products=[]

function add(){
  const name=document.getElementById('name').value
  const price=document.getElementById('price').value
  products.push({name,price})
  render()
}

function render(){
  const ul=document.getElementById('list')
  ul.innerHTML=products.map(p=>"<li>"+p.name+" - R$ "+p.price+"</li>").join('')
}

function send(){
  let msg="Orçamento:\n"
  products.forEach(p=>{
    msg+=p.name+" - R$ "+p.price+"\n"
  })
  window.open("https://wa.me/?text="+encodeURIComponent(msg))
}
</script></body>
</html>
